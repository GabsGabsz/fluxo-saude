name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  banco:
    name: Migrações + testes SQL (PostgreSQL 16)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: trust   # somente no CI efêmero
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - name: Instalar cliente psql
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Executar testes do banco
        env:
          PGHOST: localhost
          PGUSER: postgres
        run: |
          set -o pipefail
          backend/src/test/sql/run-db-tests.sh 2>&1 | tee testes-sql.log
      - name: Guardar relatório SQL
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testes-sql
          path: testes-sql.log
          if-no-files-found: warn
          retention-days: 14

  backend:
    name: Build + testes (Java 21)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Verificar Docker para os testes de integração
        run: docker info
      - name: mvn verify (unidade + integração com Testcontainers)
        working-directory: backend
        run: mvn -B -ntp verify
      - name: Guardar relatórios JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testes-java
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
          if-no-files-found: warn
          retention-days: 14
