# Configuração base. Segredos SEMPRE por variável de ambiente (nunca no repositório).
spring:
  application:
    name: fluxo-saude
  session:
    # Sessão no servidor (ADR-0002): expira após 30 min sem uso; validade absoluta em fluxo.seguranca.
    timeout: 30m
    jdbc:
      table-name: sessao.SPRING_SESSION
      initialize-schema: never      # esquema criado pela migração V7 (papel da aplicação não tem DDL)
  datasource:
    # Aplicação conecta com o papel SEM privilégios de DDL e sujeito a RLS.
    url: ${FLUXO_DB_URL:jdbc:postgresql://localhost:5432/fluxo}
    username: ${FLUXO_DB_APP_USER:fluxo_app}
    password: ${FLUXO_DB_APP_PASSWORD:}
    hikari:
      maximum-pool-size: ${FLUXO_DB_POOL:20}
      transaction-isolation: TRANSACTION_READ_COMMITTED   # exigido pela cadeia de auditoria (ADR-0003)
      connection-timeout: 5000
      # Limites por sessão do banco: espera por lock vira 409 (CannotAcquireLock) em vez de
      # prender a requisição e o pool; consulta descontrolada é abortada.
      data-source-properties:
        options: "-c lock_timeout=5s -c statement_timeout=30s"
  flyway:
    # Migrações NÃO rodam no processo da aplicação em execução: a credencial do
    # papel DONO só existe no job de migração (perfil "migracao"). Assim, uma falha
    # na aplicação não expõe credencial capaz de DDL ou de contornar o RLS.
    enabled: false
    url: ${FLUXO_DB_URL:jdbc:postgresql://localhost:5432/fluxo}
    user: ${FLUXO_DB_OWNER_USER:fluxo_owner}
    password: ${FLUXO_DB_OWNER_PASSWORD:}
    schemas: fluxo,auditoria
    create-schemas: true
    clean-disabled: true
    validate-on-migrate: true
    placeholders:
      app_role: ${FLUXO_DB_APP_USER:fluxo_app}

server:
  # Atrás de proxy reverso (TLS no proxy), habilite SOMENTE com o IP do proxy declarado,
  # senão o IP de origem (limites e auditoria) seria forjável pelo cliente:
  #   forward-headers-strategy: native
  #   tomcat.remoteip.internal-proxies: 10\\.0\\.0\\.10
  error:
    include-message: never
    include-stacktrace: never
    include-exception: false
  servlet:
    session:
      timeout: 30m
      cookie:
        # Prefixo __Host-: o navegador exige Secure, Path=/ e proíbe Domain (sem vazamento a subdomínios).
        name: __Host-FLUXO
        http-only: true
        secure: true
        same-site: strict
        path: /

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

fluxo:
  seguranca:
    max-falhas-por-origem: 30
    max-falhas-por-origem-e-login: 5
    janela-tentativas: 5m
    max-falhas-troca-senha: 5
    janela-troca-senha: 15m
    max-falhas-conta: 5
    bloqueio-conta: 5m
    max-sessoes-por-usuario: 2
    duracao-absoluta-sessao: 12h
    max-hashes-simultaneos: 4
